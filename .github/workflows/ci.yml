name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Runs the EXACT same hooks as .pre-commit-config.yaml, so local pre-commit
  # and CI never diverge.
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (with all backends)
        run: pip install -e ".[all]"
      - name: Run tests
        run: pytest -q   # slow tests are deselected by default (see pyproject)
