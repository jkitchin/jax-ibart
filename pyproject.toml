[project]
name = "jax-ibart"
version = "0.0.1"
description = "JAX-native reimplementation of iBART (iterative Bayesian Additive Regression Trees) for symbolic descriptor discovery"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "John Kitchin", email = "jkitchin@andrew.cmu.edu" }]
keywords = ["symbolic-regression", "feature-selection", "BART", "jax", "materials-informatics", "catalysis"]

dependencies = [
    "jax>=0.4.30",
    "numpy>=1.26",
    "scipy>=1.11",
    "sympy>=1.12",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# Faithful BART-G.SE selection backend (the correctness oracle path).
bart = ["bartz>=0.7"]
# Differentiable end-to-end selection backend (hard-concrete L0 gates).
diff = ["optax>=0.2"]
dev = ["pytest>=8.0", "matplotlib>=3.8"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.24", "mkdocs-jupyter>=0.24"]
all = ["bartz>=0.7", "optax>=0.2", "pytest>=8.0", "matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jax_ibart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = [
    "slow: end-to-end validation on real data (minutes); run with -m slow",
]

[tool.ruff]
line-length = 88
