[project]
name = "jax-ibart"
dynamic = ["version"]
description = "JAX-native reimplementation of iBART (iterative Bayesian Additive Regression Trees) for symbolic descriptor discovery"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "John Kitchin", email = "jkitchin@andrew.cmu.edu" }]
keywords = ["symbolic-regression", "feature-selection", "BART", "jax", "materials-informatics", "catalysis"]

dependencies = [
    "jax>=0.4.30",
    "numpy>=1.26",
    "scipy>=1.11",
    "sympy>=1.12",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.urls]
Homepage = "https://github.com/jkitchin/jax-ibart"
Documentation = "https://kitchingroup.cheme.cmu.edu/jax-ibart/"

[project.optional-dependencies]
# Faithful BART-G.SE selection backend (the correctness oracle path).
# bartz 0.11 changed the input layout and 0.11-0.13 change the BART-G.SE screen
# enough that the validated catalysis results no longer reproduce; see
# docs/oracle-crosscheck.md. Re-validate before lifting this pin.
bart = ["bartz>=0.7,<0.11"]
# Differentiable end-to-end selection backend (hard-concrete L0 gates).
diff = ["optax>=0.2"]
dev = ["pytest>=8.0", "matplotlib>=3.8"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.24", "mkdocs-jupyter>=0.24"]
all = ["bartz>=0.7,<0.11", "optax>=0.2", "pytest>=8.0", "matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/jax_ibart/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jax_ibart"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".github",
    ".pre-commit-config.yaml",
    "scripts/closing_gap_experiment.py",
    "scripts/large_budget_experiment.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = [
    "slow: end-to-end validation on real data (minutes); run with -m slow",
]

[tool.ruff]
line-length = 88
# Generated notebooks and throwaway experiment scripts are not lint targets
# (the notebooks are produced by scripts/build_notebooks.py, which IS linted).
extend-exclude = [
    "docs/examples/*.ipynb",
    "scripts/closing_gap_experiment.py",
    "scripts/large_budget_experiment.py",
]

[tool.ruff.lint]
# E741: allow I, J as math-style index-array names in the FE engine.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Tests use `pytest.importorskip(...)` before imports (skip if a backend is
# absent), which necessarily places imports below module-level code.
"tests/*" = ["E402"]
